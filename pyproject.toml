[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gnome-tv-remote"
version = "1.1.3"
description = "GNOME TV remote control over the Android TV Remote protocol v2"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.10"
dependencies = [
  "psutil>=5.9.0",
  "rsa>=4.9",
]

[project.scripts]
tv-remote = "gnome_adb_tv_remote.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]


