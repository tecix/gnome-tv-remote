app-id: io.github.tecix.TvRemote
runtime: org.gnome.Platform
runtime-version: "49"
sdk: org.gnome.Sdk
command: tv-remote

finish-args:
  - --share=network
  - --socket=wayland
  - --share=ipc
  - --socket=fallback-x11
  - --device=dri
  # D-Bus access for MPRIS media player controls
  - --own-name=org.mpris.MediaPlayer2.AndroidTVRemote

build-options:
  env:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    PIP_NO_CACHE_DIR: "1"
    PYTHONNOUSERSITE: "1"

modules:
  # Python dependencies generated with flatpak-pip-generator
  - python3-dependencies.yaml

  - name: gnome-tv-remote
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-deps --no-build-isolation .
    sources:
      - type: dir
        path: ..
